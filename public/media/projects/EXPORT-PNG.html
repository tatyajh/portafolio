<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exportar Composiciones a PNG</title>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      padding: 40px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    }
    h1 {
      color: #333;
      margin-bottom: 24px;
      font-size: 28px;
    }
    p {
      color: #666;
      margin-bottom: 24px;
      line-height: 1.6;
    }
    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    button {
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    .btn-primary {
      background: #36190D;
      color: white;
    }
    .btn-primary:hover {
      background: #59382e;
    }
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .loading {
      display: none;
      padding: 12px;
      background: #fff3cd;
      color: #333;
      border-radius: 8px;
      margin-top: 20px;
    }
    .success {
      display: none;
      padding: 12px;
      background: #d4edda;
      color: #155724;
      border-radius: 8px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📸 Exportar Composiciones</h1>
    <p>Haz clic en cada botón para descargar la composición como PNG (1400×1050).</p>

    <div class="button-group" id="buttons"></div>

    <div class="loading" id="loading">Generando PNG... espera un momento</div>
    <div class="success" id="success">✓ Descargado!</div>
  </div>

  <script>
    const compositions = [
      { id: 'mivaquita-composition', label: 'Mi Vaquita' },
      { id: 'posticks-composition', label: 'Posticks' },
      { id: 'verse-composition', label: 'Versé' },
      { id: 'tirame-poemita-composition', label: 'Tírame un Poemita' },
    ];

    const container = document.getElementById('buttons');
    const loading = document.getElementById('loading');
    const success = document.getElementById('success');

    compositions.forEach(comp => {
      const btn = document.createElement('button');
      btn.className = 'btn-primary';
      btn.textContent = comp.label;
      btn.onclick = () => exportComposition(comp.id, comp.label);
      container.appendChild(btn);
    });

    async function exportComposition(id, label) {
      const button = event.target;
      button.disabled = true;
      loading.style.display = 'block';
      success.style.display = 'none';

      try {
        // Fetch the composition HTML
        const response = await fetch(id + '.html');
        const html = await response.text();

        // Parse and get the composition
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const composition = doc.querySelector('.composition');

        if (!composition) {
          throw new Error('No se encontró .composition en ' + id + '.html');
        }

        // Add to DOM temporarily
        const temp = document.createElement('div');
        temp.style.position = 'fixed';
        temp.style.left = '-9999px';
        temp.style.top = '0';
        temp.appendChild(composition.cloneNode(true));
        document.body.appendChild(temp);

        // Wait a bit for rendering
        await new Promise(r => setTimeout(r, 1000));

        // Capture using html2canvas
        const canvas = await html2canvas(temp.querySelector('.composition'), {
          scale: 1,
          logging: false,
          useCORS: true,
          allowTaint: true,
          width: 1400,
          height: 1050
        });

        // Download
        const link = document.createElement('a');
        link.href = canvas.toDataURL('image/png');
        link.download = id.replace('-composition', '') + '.png';
        link.click();

        // Cleanup
        document.body.removeChild(temp);

        button.disabled = false;
        loading.style.display = 'none';
        success.style.display = 'block';
        setTimeout(() => { success.style.display = 'none'; }, 3000);
      } catch(err) {
        alert('Error: ' + err.message);
        button.disabled = false;
        loading.style.display = 'none';
      }
    }
  </script>
</body>
</html>
